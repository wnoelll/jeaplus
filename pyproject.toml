[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jeaplus"
dynamic = ["version"]
description = "PSRP assessment client for ConstrainedLanguage and NoLanguage JEA endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pypsrp>=0.8.1,<0.10"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
kerberos = ["pypsrp[kerberos]>=0.8.1,<0.10"]
credssp = ["pypsrp[credssp]>=0.8.1,<0.10"]
dev = [
  "mypy>=1.10,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<0.17",
]

[project.scripts]
jeaplus = "jea_plus:main"

[tool.setuptools]
py-modules = ["jea_plus"]

[tool.setuptools.dynamic]
version = { attr = "jea_plus.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["jea_plus"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
